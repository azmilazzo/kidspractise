<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P3 Malay Mastery Lab (50Q Randomized)</title>
  <style>
    :root {
      --bg: #1e1e2e;
      --card-bg: #2b2b3d;
      --accent: #74c7ec;
      --success: #a6e3a1;
      --error: #f38ba8;
      --text: #cdd6f4;
      --subtext: #a6adc8;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 { color: var(--accent); margin-bottom: 5px; text-align: center; }
    p.subtitle { color: var(--subtext); margin-top: 0; margin-bottom: 20px; text-align: center; }

    .nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .nav button {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--accent);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .nav button.active {
      background: var(--accent);
      color: var(--bg);
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      display: none;
      box-sizing: border-box;
    }

    .container.active { display: block; }

    .word-pool, .sentence-target {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      min-height: 50px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(0,0,0,0.2);
      margin-bottom: 15px;
    }

    .sentence-target { border: 2px dashed var(--accent); }

    .word-tile {
      background: var(--accent);
      color: var(--bg);
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s;
    }

    .word-tile:hover { transform: scale(1.05); }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }

    .option-btn {
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s;
    }

    .option-btn:hover {
      background: var(--accent);
      color: var(--bg);
    }

    .btn-action {
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    .feedback {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      min-height: 25px;
    }

    .score-display {
      font-size: 20px;
      color: var(--success);
      font-weight: bold;
      margin-bottom: 15px;
      text-align: right;
      width: 100%;
      max-width: 650px;
    }

    .progress {
      font-size: 14px;
      color: var(--subtext);
      margin-bottom: 10px;
    }
  </style>
</head>

      { sentence: "Murid-murid ___ lagu sekolah.", correct: "menyanyi", options: ["menyanyi", "menari", "membaca", "berlari"], english: "Students sing the school song." },
      { sentence: "Ibu ___ baju yang telah kering.", correct: "menggosok", options: ["menggosok", "membuat", "membeli", "membuang"], english: "Mother irons the dry clothes." },
      { sentence: "Adik ___ air di dalam gelas.", correct: "menuang", options: ["menuang", "meminum", "membuang", "mencuci"], english: "Younger sibling pours water into a glass." },
      { sentence: "Abang ___ pokok kelapa yang tinggi.", correct: "memanjat", options: ["memanjat", "melompat", "berlari", "berenang"], english: "Older brother climbs the tall coconut tree." },
      { sentence: "Kakak ___ gambar bunga yang cantik.", correct: "warnakan/warnai", options: ["Mewarnai", "Melukis", "Memotong", "Membuang"], english: "Sister colors a beautiful flower picture." },
      { sentence: "Ayah ___ pokok di halaman rumah.", correct: "menebang", options: ["menebang", "menyiram", "menanam", "memetik"], english: "Father cuts down a tree in the yard." },
      { sentence: "Nenek ___ sayur di kebun.", correct: "memetik", options: ["memetik", "memotong", "membakar", "membuang"], english: "Grandmother picks vegetables in the garden." },

      { sentence: "Adik ___ bola ke arah gol.", correct: "menendang", options: ["menendang", "memukul", "memegang", "membuang"], english: "Sibling kicks the ball towards the goal." },
      { sentence: "Pemain itu ___ bola dengan raket.", correct: "memukul", options: ["memukul", "menendang", "menarik", "menolak"], english: "That player hits the ball with a racket." },
      { sentence: "Saya ___ jawapan yang betul.", correct: "memilih", options: ["memilih", "membaca", "menulis", "padam"], english: "I choose the correct answer." },
      { sentence: "Guru ___ murid yang rajin.", correct: "memuji", options: ["memuji", "marah", "melihat", "membaca"], english: "Teacher praises hardworking students." },
      { sentence: "Abang ___ meja yang berat itu.", correct: "menolak", options: ["menolak", "menarik", "membuang", "memukul"], english: "Older brother pushes that heavy table." },
      { sentence: "Adik ___ pintu untuk masuk.", correct: "menarik", options: ["menarik", "menolak", "mengunci", "memukul"], english: "Younger sibling pulls the door to enter." },
      { sentence: "Ibu ___ wang di dalam bank.", correct: "menyimpan", options: ["menyimpan", "membuang", "membeli", "meminjam"], english: "Mother saves money in the bank." }
    ];

    // State Active Arrays
    let activeSentences = [];
    let activePenjodoh = [];
    let activeKataKerja = [];

    let currentBA = 0;
    let currentPB = 0;
    let currentKK = 0;

    // TAB MANAGEMENT
    function showTab(id) {
      document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');

      if (id === 'bina-ayat') {
        document.getElementById('btn-ba').classList.add('active');
        initBinaAyat();
      }
      if (id === 'penjodoh') {
        document.getElementById('btn-pb').classList.add('active');
        initPenjodoh();
      }
      if (id === 'kata-kerja') {
        document.getElementById('btn-kk').classList.add('active');
        initKataKerja();
      }
    }

    // --- 1. BINA AYAT LOGIC ---
    function initBinaAyat() {
      if (activeSentences.length === 0 || currentBA === 0) {
        activeSentences = shuffleArray(rawSentences);
        currentBA = 0;
      }

      const target = document.getElementById('target-zone');
      const pool = document.getElementById('pool-zone');
      const feedback = document.getElementById('ba-feedback');
      document.getElementById('ba-progress').innerText = `Question ${currentBA + 1} / ${activeSentences.length}`;
      
      target.innerHTML = '';
      pool.innerHTML = '';
      feedback.innerText = '';

      let data = activeSentences[currentBA];
      document.getElementById('ba-english').innerText = `English translation: "${data.english}"`;

      let shuffledWords = shuffleArray(data.malay);
      shuffledWords.forEach(word => {
        let tile = document.createElement('div');
        tile.className = 'word-tile';
        tile.innerText = word;
        tile.onclick = () => {
          if (tile.parentElement === pool) {
            target.appendChild(tile);
          } else {
            pool.appendChild(tile);
          }
        };
        pool.appendChild(tile);
      });
    }

    function checkSentence() {
      const targetWords = Array.from(document.getElementById('target-zone').children).map(c => c.innerText);
      const correctWords = activeSentences[currentBA].malay;
      const feedback = document.getElementById('ba-feedback');

      if (JSON.stringify(targetWords) === JSON.stringify(correctWords)) {
        feedback.style.color = 'var(--success)';
        feedback.innerText = 'Tahniah! Betul! 🎉';
        speak(correctWords.join(' '));
        addScore(15);
        currentBA = (currentBA + 1) % activeSentences.length;
        setTimeout(initBinaAyat, 1500);
      } else {
        feedback.style.color = 'var(--error)';
        feedback.innerText = 'Cuba lagi! Susun kata mengikut urutan yang betul.';
      }
    }

    // --- 2. PENJODOH BILANGAN LOGIC ---
    function initPenjodoh() {
      if (activePenjodoh.length === 0 || currentPB === 0) {
        activePenjodoh = shuffleArray(rawPenjodoh);
        currentPB = 0;
      }

      const itemEl = document.getElementById('pb-item');
      const optsEl = document.getElementById('pb-options');
      const feedback = document.getElementById('pb-feedback');
      document.getElementById('pb-progress').innerText = `Question ${currentPB + 1} / ${activePenjodoh.length}`;

      feedback.innerText = '';
      optsEl.innerHTML = '';

      let current = activePenjodoh[currentPB];
      itemEl.innerText = current.item;

      let shuffledOpts = shuffleArray(current.options);
      shuffledOpts.forEach(opt => {
        let btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => {
          if (opt === current.correct) {
            feedback.style.color = 'var(--success)';
            feedback.innerText = 'Betul! 👍';
            speak(current.item.replace('___', opt));
            addScore(10);
            currentPB = (currentPB + 1) % activePenjodoh.length;
            setTimeout(initPenjodoh, 1200);
          } else {
            feedback.style.color = 'var(--error)';
            feedback.innerText = 'Salah! Cuba lagi.';
          }
        };
        optsEl.appendChild(btn);
      });
    }

    // --- 3. IMBUHAN & KATA KERJA LOGIC ---
    function initKataKerja() {
      if (activeKataKerja.length === 0 || currentKK === 0) {
        activeKataKerja = shuffleArray(rawKataKerja);
        currentKK = 0;
      }

      const sentEl = document.getElementById('kk-sentence');
      const engEl = document.getElementById('kk-english');
      const optsEl = document.getElementById('kk-options');
      const feedback = document.getElementById('kk-feedback');
      document.getElementById('kk-progress').innerText = `Question ${currentKK + 1} / ${activeKataKerja.length}`;

      feedback.innerText = '';
      optsEl.innerHTML = '';

      let current = activeKataKerja[currentKK];
      sentEl.innerText = current.sentence;
      engEl.innerText = `English: "${current.english}"`;

      let shuffledOpts = shuffleArray(current.options);
      shuffledOpts.forEach(opt => {
        let btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => {
          if (opt === current.correct) {
            feedback.style.color = 'var(--success)';
            feedback.innerText = 'Betul! 🌟';
            speak(current.sentence.replace('___', opt));
            addScore(10);
            currentKK = (currentKK + 1) % activeKataKerja.length;
            setTimeout(initKataKerja, 1200);
          } else {
            feedback.style.color = 'var(--error)';
            feedback.innerText = 'Salah! Pilihlah kata kerja yang tepat.';
          }
        };
        optsEl.appendChild(btn);
      });
    }

    // Initialize initial tab
    initBinaAyat();
  </script>
