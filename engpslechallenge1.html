<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PSLE English Challenge Pack 1</title>
<style>
:root{
  --bg1:#ede9fe;
  --bg2:#e0e7ff;
  --card:#fff;
  --ink:#0f172a;
  --muted:#475569;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Nunito","Comic Sans MS",sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  color:var(--ink);
  line-height:1.45;
}
button{font-family:inherit}
.container{max-width:760px;margin:0 auto;padding:16px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.brand{font-weight:1000;font-size:1.2rem}
.chip{display:inline-block;background:#c4b5fd;color:#5b21b6;padding:8px 12px;border-radius:999px;font-weight:900;font-size:.9rem}
.hero{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;padding:20px;border-radius:24px;box-shadow:0 14px 34px rgba(124,58,237,.18)}
.hero h1{margin:0 0 8px;font-size:1.5rem}
.hero p{margin:0;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border-radius:18px;padding:12px;text-align:center;box-shadow:0 10px 24px rgba(15,23,42,.06)}
.value{font-size:1.4rem;font-weight:1000}
.label{color:var(--muted);font-weight:800;font-size:.9rem}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 10px 24px rgba(15,23,42,.08);margin:12px 0}
.topic-card{cursor:pointer;border:3px solid transparent;transition:.15s}
.topic-card:active{transform:scale(.99)}
.topic-card:hover{border-color:#a78bfa}
.topic-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.emoji{font-size:2rem}
.topic-title{font-weight:1000;margin:8px 0 4px}
.small{color:var(--muted);font-weight:800;font-size:.9rem}
.progress{height:12px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:10px 0}
.progress div{height:100%;background:linear-gradient(90deg,#7c3aed,#4f46e5)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn{border:0;border-radius:16px;padding:12px 16px;font-weight:1000;cursor:pointer}
.primary{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff}
.secondary{background:#e2e8f0;color:#0f172a}
.notes{padding-left:20px;margin:10px 0}
.notes li{margin:6px 0;font-weight:700}
.options{display:grid;gap:10px;margin-top:12px}
.option{border:3px solid #c4b5fd;background:#faf8ff;border-radius:18px;padding:14px;font-size:1rem;font-weight:900;text-align:left;cursor:pointer}
.option:disabled{opacity:.95}
.option.correct{background:#ecfdf5;border-color:#10b981}
.option.wrong{background:#fff1f2;border-color:#f43f5e}
.feedback{margin-top:14px;padding:14px;border-radius:18px;font-weight:900}
.feedback.good{background:#ecfdf5;border:2px solid #a7f3d0}
.feedback.bad{background:#fff1f2;border:2px solid #fecdd3}
.exp{margin-top:6px;font-weight:600}
.review-item{border:2px solid #e2e8f0;border-radius:18px;padding:12px;margin:10px 0;background:#fbfdff}
.review-q{font-weight:1000;margin-bottom:6px}
.correct-answer{color:#047857;font-weight:1000}
.user-answer{color:#be123c;font-weight:1000}
.hidden{display:none !important}
.result-stars{font-size:2.2rem;margin:8px 0}
.error-box{background:#fff1f2;border:2px solid #f43f5e;border-radius:16px;padding:16px;font-weight:700;white-space:pre-wrap;font-family:monospace}
</style>
</head>
<body>
<main id="app"></main>

<script>
window.addEventListener("error",function(e){
  document.getElementById("app").innerHTML='<div class="container"><div class="error-box">Page error: '+(e.message||"Unknown")+'</div></div>';
});

["Transform: 'People believe that he is innocent.' Passive with reporting verb.",["He is believed to be innocent.","He was believed to be innocent.","He has been believed to be innocent.","He believes to be innocent."],"Passive with reporting verb: is believed to be."],
["Combine: 'He was late. He was not punished.' Use 'nevertheless'.",["He was late; nevertheless, he was not punished.","He was late; nevertheless he was not punished.","Nevertheless he was late, he was not punished.","He was late nevertheless, he was not punished."],"'Nevertheless' follows a semicolon and precedes a comma."],
["Transform: 'They have completed the project.' Passive voice.",["The project has been completed.","The project was completed.","The project is completed.","The project has completed."],"Present perfect passive."],
["Combine: 'She is a talented musician. She is also a gifted painter.' Use 'not only...but also'.",["She is not only a talented musician but also a gifted painter.","She is not only a talented musician but also she is a gifted painter.","Not only she is a talented musician but also a gifted painter.","She not only is a talented musician but also a gifted painter."],"'Not only...but also' connects parallel noun phrases."],
["Transform: 'The chef is preparing the meal.' Passive voice.",["The meal is being prepared by the chef.","The meal is prepared by the chef.","The meal was prepared by the chef.","The meal has been prepared by the chef."],"Present continuous passive."],
["Combine: 'It was very cold. The lake froze.' Use 'so...that'.",["It was so cold that the lake froze.","It was so cold that the lake freezes.","It was so cold that the lake has frozen.","It was so cold that the lake will freeze."],"'So...that' shows result."]
]
},

{
id:"adv-grammar-mix",
title:"Advanced Grammar Mix",
emoji:"⚡",
blurb:"Mixed advanced grammar: conditionals, subjunctive, inversion and complex structures.",
notes:["Conditionals follow specific tense patterns.","Inversion adds emphasis or formality."],
qs:[
["If I ___ you, I would accept the offer immediately.",["were","was","am","be"],"Second conditional uses 'were' for all subjects."],
["If she had known about the meeting, she ___ attended.",["would have","would","will have","will"],"Third conditional: would have + past participle."],
["___ had I arrived when the phone rang.",["No sooner","Hardly","Scarcely","Rarely"],"'No sooner...than' uses inversion."],
["Not only ___ the exam, but she also scored the highest marks.",["did she pass","she passed","she did pass","passed she"],"'Not only' at the start triggers inversion."],
["If it ___ to rain, we would have to cancel the event.",["were","was","is","be"],"Second conditional uses 'were'."],
["She suggested that he ___ a doctor immediately.",["see","sees","saw","seen"],"'Suggest' + that + base verb (subjunctive)."],
["It is essential that every student ___ the safety briefing.",["attend","attends","attended","attending"],"'Essential' + that + base verb (subjunctive)."],
["If I ___ a million dollars, I would donate it all to charity.",["had","have","has","having"],"Second conditional for present unreal."],
["Had he ___ the warning, he would not have made the mistake.",["heeded","heed","heeds","heeding"],"Inverted third conditional: Had + subject + past participle."],
["Not until she ___ the truth did she feel relieved.",["told","tells","has told","had told"],"'Not until' + past simple triggers inversion in main clause."],
["If water ___ to 100 degrees Celsius, it boils.",["is heated","was heated","were heated","has been heated"],"Zero conditional for scientific facts."],
["I wish I ___ more time to prepare for the examination.",["had","have","has","having"],"'Wish' + past simple for present unreal."],
["She insisted that he ___ present at the meeting.",["be","is","was","been"],"'Insist' + that + base verb (subjunctive)."],
["If he ___ harder when he was younger, he would be more successful now.",["had worked","worked","has worked","was working"],"Mixed conditional: past condition, present result."],
["Seldom ___ such a magnificent performance.",["have I seen","I have seen","I saw","did I saw"],"'Seldom' at the start triggers inversion."],
["If I ___ a bird, I would fly to the moon.",["were","was","am","be"],"Second conditional uses 'were'."],
["It is vital that the patient ___ operated on immediately.",["be","is","was","been"],"'Vital' + that + base verb (subjunctive)."],
["Were she ___ the opportunity, she would take it.",["given","give","gives","giving"],"Inverted second conditional: Were + subject + past participle."],
["If only I ___ the truth earlier.",["had known","knew","have known","know"],"'If only' + past perfect for past regret."],
["Under no circumstances ___ the door be left unlocked.",["should","shall","will","would"],"'Under no circumstances' triggers inversion with 'should'."],
["If he ___ the train, he would have been on time.",["had caught","caught","catches","has caught"],"Third conditional for past unreal."],
["She recommended that the report ___ submitted by Friday.",["be","is","was","been"],"'Recommend' + that + base verb (subjunctive)."],
["Only after she ___ the letter did she understand the situation.",["had read","has read","reads","read"],"'Only after' + past perfect triggers inversion."],
["If I ___ in your shoes, I would apologise.",["were","was","am","be"],"Second conditional uses 'were'."],
["So engrossed ___ in the book that she forgot the time.",["was she","she was","she were","were she"],"'So + adjective' at the start triggers inversion."]

{

qs:[
["The committee ___ unable to reach a consensus after hours of discussion.",["was","were","are","be"],"Collective noun acting as one unit is singular."],

["Neither the principal nor the teachers ___ informed about the inspection.",["were","was","is","be"],"With 'nor', verb matches closer subject 'teachers'."],
["Each of the contestants ___ given a participation certificate.",["was","were","are","be"],"'Each' is always singular."],
["The news about the school's achievement ___ spread quickly.",["has","have","had","having"],"'News' is uncountable singular."],

["By the time the results were announced, the students ___ waiting for two hours.",["had been","have been","were","are"],"Past perfect continuous for duration before a past event."],
["The number of applicants ___ risen sharply this year.",["has","have","had","having"],"'The number of' is singular."],

["The team ___ divided in their opinions about the strategy.",["are","is","was","be"],"Collective noun with individual opinions is plural."],
["Somebody ___ left a suspicious bag at the school gate.",["has","have","had","having"],"'Somebody' is singular."],
["The trousers ___ too tight for him to wear comfortably.",["are","is","was","be"],"'Trousers' is always plural."],
["There ___ a book, two pens and a calculator on the desk.",["is","are","were","be"],"Verb matches the first noun after 'there'."],
["Each boy and each girl ___ given a participation medal.",["was","were","are","be"],"'Each' before each noun keeps it singular."],
["The group of volunteers ___ cleaning up the park this Saturday.",["is","are","were","be"],"'Group' is a singular collective noun."],
["One of my best friends ___ recently moved overseas.",["has","have","had","having"],"'One' is singular."],
["The quality of these handmade crafts ___ truly remarkable.",["is","are","were","be"],"'Quality' is the singular subject."]

];

const QUESTIONS=[];
TOPICS.forEach(topic=>{
  topic.qs.forEach((item,index)=>{
    QUESTIONS.push({
      id:topic.id+"-"+(index+1),
      topic:topic.id,
      q:item[0],
      options:item[1],
      exp:item[2]
    });
  });
});

const STORAGE_KEY="psleEnglishChallengePack1";
const app=document.getElementById("app");
let progress=loadProgress();
let state={questions:[],index:0,correct:0,answered:false,title:"",misses:[]};

function loadProgress(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return{attempts:{},correct:{},wrong:[]};
    const data=JSON.parse(raw);
    return{attempts:data.attempts||{},correct:data.correct||{},wrong:data.wrong||[]};
  }catch(e){return{attempts:{},correct:{},wrong:[]};}
}
function saveProgress(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(progress));}catch(e){}}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function shuffle(a){const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;}
function prepareQuestions(list){
  return list.map(q=>{
    const opts=q.options.map((t,i)=>({text:t,correct:i===0}));
    const s=shuffle(opts);
    return{...q,options:s.map(o=>o.text),answer:s.findIndex(o=>o.correct)};
  });
}
function getTopic(id){return TOPICS.find(t=>t.id===id);}
function getQuestionsByTopic(id){return QUESTIONS.filter(q=>q.topic===id);}
function getStats(){
  const attempted=Object.keys(progress.attempts).length;
  let tA=0,tC=0;
  for(const id in progress.attempts)tA+=progress.attempts[id];
  for(const id in progress.correct)tC+=progress.correct[id];
  return{attempted,accuracy:tA?Math.round((tC/tA)*100):0,wrong:progress.wrong.length};
}

function renderHome(){
  const stats=getStats();
  const cards=TOPICS.map(topic=>{
    const total=topic.qs.length;
    const mastered=QUESTIONS.filter(q=>q.topic===topic.id&&progress.correct[q.id]>0).length;
    const pct=total?Math.round((mastered/total)*100):0;
    return`<div class="card topic-card" onclick="openTopic('${topic.id}')">
      <div class="topic-top"><div class="emoji">${topic.emoji}</div><div class="chip">PSLE</div></div>
      <div class="topic-title">${esc(topic.title)}</div>
      <div class="small">${esc(topic.blurb)}</div>
      <div class="progress"><div style="width:${pct}%"></div></div>
      <div class="small">${mastered}/${total} correct at least once</div>
    </div>`;
  }).join("");
  app.innerHTML=`<div class="container">
    <div class="topbar"><div class="brand">🏆 PSLE English Challenge Pack 1</div><div class="chip">250 MCQs</div></div>
    <div class="hero">
      <h1>PSLE English Challenge Pack 1</h1>
      <p>10 topics × 25 questions covering PSLE-style grammar, vocabulary, editing, synthesis and comprehension.</p>
      <div class="actions">
        <button class="btn primary" onclick="startAllChallenge()">🌟 Random 20</button>
        <button class="btn primary" onclick="startRandomTen()">🎲 Random 10</button>
        <button class="btn primary" onclick="startWrongAll()">❌ Wrong Replay</button>
        <button class="btn secondary" onclick="resetProgress()">♻️ Reset</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="value">${stats.attempted}</div><div class="label">Questions practiced</div></div>
      <div class="stat"><div class="value">${stats.accuracy}%</div><div class="label">Accuracy</div></div>
      <div class="stat"><div class="value">${stats.wrong}</div><div class="label">Wrong questions</div></div>
      <div class="stat"><div class="value">${TOPICS.length}</div><div class="label">Challenge areas</div></div>
    </div>
    ${cards}
  </div>`;
  window.scrollTo({top:0,behavior:"smooth"});
}

function openTopic(id){
  const topic=getTopic(id);
  const notesHtml=topic.notes.map(n=>`<li>${esc(n)}</li>`).join("");
  app.innerHTML=`<div class="container">
    <div class="topbar"><button class="btn secondary" onclick="renderHome()">⬅ Home</button><div class="chip">PSLE Topic</div></div>
    <div class="card">
      <div class="topic-top"><div class="emoji">${topic.emoji}</div><div class="chip">PSLE</div></div>
      <h2>${esc(topic.title)}</h2>
      <p style="font-weight:800;">${esc(topic.blurb)}</p>
      <h3>Focus</h3><ul class="notes">${notesHtml}</ul>
      <div class="actions">
        <button class="btn primary" onclick="startTopic('${topic.id}')">▶️ Start 25 Questions</button>
        <button class="btn secondary" onclick="startTopicWrong('${topic.id}')">❌ Wrong in Topic</button>
      </div>
    </div>
  </div>`;
  window.scrollTo({top:0,behavior:"smooth"});
}

function startAllChallenge(){startQuiz(shuffle(QUESTIONS).slice(0,20),"Random 20 Challenge");}
function startRandomTen(){startQuiz(shuffle(QUESTIONS).slice(0,10),"Random 10");}
function startWrongAll(){
  const qs=QUESTIONS.filter(q=>progress.wrong.includes(q.id));
  if(!qs.length){alert("No wrong questions saved yet.");return;}
  startQuiz(qs,"Wrong Replay");
}
function startTopic(id){startQuiz(getQuestionsByTopic(id),getTopic(id).title);}
function startTopicWrong(id){
  const topic=getTopic(id);
  const qs=QUESTIONS.filter(q=>q.topic===id&&progress.wrong.includes(q.id));
  if(!qs.length){alert("No wrong questions in this topic yet.");return;}
  startQuiz(qs,"Wrong Replay: "+topic.title);
}

function startQuiz(list,title){
  if(!list.length){alert("No questions available.");return;}
  state={questions:prepareQuestions(list),index:0,correct:0,answered:false,title,misses:[]};
  renderQuestion();
}

function renderQuestion(){
  const q=state.questions[state.index];
  const topic=getTopic(q.topic);
  const pct=(state.index/state.questions.length)*100;
  const opts=q.options.map((o,i)=>
    `<button class="option" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`
  ).join("");
  app.innerHTML=`<div class="container">
    <div class="topbar"><button class="btn secondary" onclick="renderHome()">🏠 Home</button><div class="chip">${esc(state.title)}</div></div>
    <div class="card">
      <div class="progress"><div style="width:${pct}%"></div></div>
      <div class="small">Question ${state.index+1} of ${state.questions.length} • Score ${state.correct}</div>
      <div class="chip" style="margin:10px 0;">${topic.emoji} ${esc(topic.title)}</div>
      <h2>${esc(q.q)}</h2>
      <div class="options">${opts}</div>
      <div id="feedback" class="feedback hidden"></div>
    </div>
  </div>`;
  window.scrollTo({top:0,behavior:"smooth"});
}

function answer(selected){
  if(state.answered)return;
  state.answered=true;
  const q=state.questions[state.index];
  const buttons=Array.from(document.querySelectorAll(".option"));
  buttons.forEach(b=>b.disabled=true);
  buttons[q.answer].classList.add("correct");
  const isCorrect=selected===q.answer;
  if(isCorrect){state.correct++;buttons[selected].classList.add("correct");}
  else{buttons[selected].classList.add("wrong");state.misses.push({id:q.id,selected});}
  updateProgress(q.id,isCorrect);
  const fb=document.getElementById("feedback");
  fb.className="feedback "+(isCorrect?"good":"bad");
  fb.innerHTML=`<div>${isCorrect?"✅ Correct!":"❌ Not quite."}</div>
    <div class="exp">${esc(q.exp)}${!isCorrect?" Correct answer: "+esc(q.options[q.answer])+".":""}</div>
    <div class="actions"><button class="btn primary" onclick="nextQuestion()">
      ${state.index===state.questions.length-1?"Finish 🏁":"Next ➜"}
    </button></div>`;
}

function updateProgress(id,isCorrect){
  progress.attempts[id]=(progress.attempts[id]||0)+1;
  if(isCorrect){progress.correct[id]=(progress.correct[id]||0)+1;progress.wrong=progress.wrong.filter(w=>w!==id);}
  else{if(!progress.wrong.includes(id))progress.wrong.push(id);}
  saveProgress();
}

function nextQuestion(){
  if(!state.answered)return;
  if(state.index<state.questions.length-1){state.index++;state.answered=false;renderQuestion();}
  else finishQuiz();
}

function finishQuiz(){
  const total=state.questions.length;
  const percent=Math.round((state.correct/total)*100);
  let stars="💪",msg="Keep practising! Read the explanations and try again.";
  if(percent>=90){stars="🌟🌟🌟";msg="Excellent!";}
  else if(percent>=75){stars="🌟🌟";msg="Great job! Review the missed questions.";}
  else if(percent>=50){stars="🌟";msg="Good effort! Focus on the explanations.";}
  const seen=new Set();
  const unique=state.misses.filter(m=>{if(seen.has(m.id))return false;seen.add(m.id);return true;});
  const reviewHtml=unique.map(miss=>{
    const q=state.questions.find(i=>i.id===miss.id);
    const topic=getTopic(q.topic);
    return`<div class="review-item">
      <div class="small">${topic.emoji} ${esc(topic.title)}</div>
      <div class="review-q">${esc(q.q)}</div>
      <div class="user-answer">Your answer: ${esc(q.options[miss.selected])}</div>
      <div class="correct-answer">Correct answer: ${esc(q.options[q.answer])}</div>
      <div>${esc(q.exp)}</div>
    </div>`;
  }).join("");
  app.innerHTML=`<div class="container">
    <div class="topbar"><button class="btn secondary" onclick="renderHome()">🏠 Home</button><div class="chip">Result</div></div>
    <div class="card">
      <h2>${esc(state.title)} Complete!</h2>
      <div class="result-stars">${stars}</div>
      <p style="font-weight:900;">You scored ${state.correct}/${total} (${percent}%). ${msg}</p>
      <div class="actions">
        <button class="btn primary" onclick="renderHome()">🏠 Home</button>
        ${unique.length?'<button class="btn secondary" onclick="retryWrong()">❌ Retry Wrong</button>':""}
      </div>
      <h3>Review</h3>
      ${unique.length?reviewHtml:"<p>🎉 Perfect! No wrong questions this round.</p>"}
    </div>
  </div>`;
  window.scrollTo({top:0,behavior:"smooth"});
}

function retryWrong(){
  const ids=[...new Set(state.misses.map(m=>m.id))];
  startQuiz(QUESTIONS.filter(q=>ids.includes(q.id)),"Retry Wrong");
}

function resetProgress(){
  if(confirm("Reset all PSLE English Challenge Pack 1 progress?")){
    progress={attempts:{},correct:{},wrong:[]};
    saveProgress();
    renderHome();
  }
}

renderHome();
</script>

</html>
